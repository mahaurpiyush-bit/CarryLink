spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:carrylink;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
server:
  error:
    include-message: always
carrylink:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-32-byte-value}
  jwt-expiration-minutes: 120
